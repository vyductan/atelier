# Atelier Dispatcher: the bot team on OpenMausBot.
# Apply:  ~/.atelier/openmausbot/bin/node_modules/.bin/openmausbot team apply team.yaml --port 28799
# Check:  ... team apply team.yaml --port 28799 --check   (exit 6 = server drifted from this file)
#
# Rules (spec "Atelier Dispatcher" on vyductan.dev tasks):
# - No bot is `full` (a Chief's level is passed down to the bots it hands work to),
#   except bl3q-lead, bl3q-fix, CoS (2026-11-19), Review (2026-11-20), the two intake
#   bots (2026-11-20, spec e14d2c6b) and bl3q-verifier (2026-11-22), by the owner's
#   explicit choice.
# - Every bot sits in a team with a Chief (CoS for vyductan, bl3q-lead for bl3q):
#   OpenMausBot auto-retries a failed run and sends incident turns to the Chief
#   (server/host/chief-notices.ts), which costs model turns. Workers used to have no
#   Chief to avoid that; the owner chose the grouping on 2026-11-19.
# - Chiefs' admin tools (create_bot, app_settings, ...) are denied in their settings.
# - Hard limits live in each bot's cwd `.claude/settings.json` (deny), not in `tools`:
#   for Claude, `tools` only filters MCP tools.
# - computer: off everywhere (local needs the desktop app; headless runs fail with it).
version: 1

teams:
  # The vyductan.dev team (owner's choice 2026-11-19): CoS is its Chief, so it
  # hears about Dev/Review/Ops failures and OpenMausBot retries their failed runs.
  # Since 2026-11-21 (owner's choice) CoS hands out the work itself with
  # coordinate_bots, the way bl3q-lead does: Dev, then Review on Dev's branch,
  # once back to Dev on a fail, then the person merges. The bridge only splits
  # approved plans (Dev has `handedOutBy: CoS` in its config) and runs routines.
  - name: vyductan
    brief: vyductan.dev work. CoS triages and briefs tasks and hands them to Dev, Review checks Dev's branch against the brief for CoS, the person merges. Ops sums up the morning's errors.
  # Spec "Nhóm bot bl3q" (vyductan-tasks, project bl3q). Lead is this team's Chief
  # by the owner's choice (2026-11-19): it hands work to fix and review with
  # coordinate_bots. Its settings deny the Chief's admin tools. It runs `full` by
  # the owner's choice, which also raises fix to full. Merging is NOT a bot: the
  # merge gate (bl3q tools/agent_merge.py, run by the lead) reads bl3q-verifier's verdicts.
  - name: bl3q
    brief: Daily upkeep of the bl3q game bot. Lead triages the error digest after each daily game run (00:00 and 09:00), fix repairs on agent/* branches in a worktree, verifier checks the code and the real game independently; a code gate the lead runs merges.

bots:
  - name: MausBot
    chief: false
    approval: ask
    computer: off

  - name: CoS
    team: vyductan
    chief: true
    title: Chief of Staff
    # Opus + full set in the UI by the owner (folded in 2026-11-19).
    model: claude/claude-opus-5-5
    approval: full
    computer: off
    cwd: /Users/vyductan/.atelier/openmausbot/workspaces/cos
    soul: { file: souls/cos.md }

  # `full` by owner choice 2026-11-20 (cards stalled every unattended run).
  # Its limits are team/settings/dev.json: OS sandbox on Bash, deny rules on
  # Edit outside the worktree, on git internals and on OMB admin/tasks MCP.
  - name: Dev
    team: vyductan
    title: Dev vyductan
    model: claude/claude-sonnet-5-5
    approval: full
    computer: off
    cwd: /Users/vyductan/Developer/vyductan-agent
    soul: { file: souls/dev.md }

  # Checks Dev's branch for the bridge (bot Dev has reviewer: Review in the
  # bridge config). `auto` so it can read the worktree and run checks without a
  # card; no Edit/Write, and its sandbox writes only its runs/ folder.
  # Opus, not Dev's Sonnet: a different model is harder to talk round.
  - name: Review
    team: vyductan
    title: Review vyductan (chấm nhánh của Dev)
    model: claude/claude-opus-5-5
    # full: the owner's choice (2026-11-20) so installs and tests run without
    # cards; the sandbox still keeps Bash off .env, ~/Library and the repo source.
    approval: full
    computer: off
    cwd: /Users/vyductan/.vyductan-team/review
    soul: { file: souls/review.md }

  # Tests tasks in `testing` in a real browser against a local copy of the app
  # (origin/main, seeded DB). CoS hands it one task at a time in the daily
  # routine. No Edit/Write: its sandbox writes only scenarios/_bot of its
  # worktree; app + browser run outside the sandbox via team/bin/e2e-stack.sh
  # (Chrome and Turbopack cannot start inside it). allowLocalBinding: owner's
  # choice 2026-11-23, knowing it opens every localhost port (like bl3q-fix).
  - name: Tester
    team: vyductan
    title: Tester vyductan (thử task đang Testing)
    model: claude/claude-opus-5-5
    approval: full
    computer: off
    cwd: /Users/vyductan/.vyductan-team/tester
    soul: { file: souls/tester.md }

  # No tools at all (cwd settings deny everything): the bridge runs the
  # read-only `ops-digest` collector each morning and hands Ops the JSON.
  - name: Ops
    team: vyductan
    title: Ops (tóm tắt lỗi mỗi sáng)
    model: claude/claude-haiku-5-5
    approval: ask
    computer: off
    cwd: /Users/vyductan/.atelier/openmausbot/workspaces/ops
    soul: { file: souls/ops.md }

  # Records the owner's reports as tasks in project vyductan (spec e14d2c6b,
  # Atelier ADR 0001). `full` so a report from the phone has no cards; safety
  # is its settings (no shell, no writes, no coordinate_bots) plus the tasks
  # server's write policy for its token (label `intake`): only triage, idea or
  # blocked, no priority, no Bot:/Plan: line. Not the Chief.
  - name: Intake
    team: vyductan
    title: Intake (ghi nhận báo cáo)
    model: claude/claude-opus-5-5
    approval: full
    computer: off
    cwd: /Users/vyductan/.atelier/openmausbot/workspaces/intake
    soul: { file: souls/intake.md }

  # g-bots (read-only investigator) was removed 2026-11-19: bl3q has its own
  # team now. The bot is hidden in OpenMausBot, not deleted (its threads stay).

  # --- team bl3q -----------------------------------------------------------
  # cwd under ~/.bl3q-team, NOT ~/.atelier: the sandbox and Read denies block
  # ~/.atelier, and review's Bash must run from its own folder.
  - name: bl3q-lead
    team: bl3q
    chief: true
    title: "bl3q trưởng nhóm (giao việc, chạy gate merge)"
    model: claude/claude-opus-5-5  # changed in the web UI 2026-11-19
    # full: the OWNER's choice (2026-11-19), made knowing that OpenMausBot raises
    # every thread this Chief hands work to up to full (delegatedApprovalMode),
    # so bl3q-fix runs full too and its Write tool is not sandboxed.
    approval: full
    computer: off
    cwd: /Users/vyductan/.bl3q-team/lead
    soul: { file: souls/bl3q-lead.md }

  # Bash auto-allowed only inside the sandbox (autoAllowBashIfSandboxed):
  # writes limited to the worktree and refs/heads/agent/*, no network.
  # Owner of each item (owner's choice 2026-11-20, pstack autopilot): loops to
  # code-ready, never asks for review (coordinate_bots denied in its settings);
  # bl3q-lead runs bl3q-verifier and owns the verdicts. Escalates to a fable
  # subagent after two rejected attempts on one idea.
  # Opus by owner choice; review is Opus too (a different family is a later step).
  - name: bl3q-fix
    team: bl3q
    title: "bl3q sửa lỗi (viết code trên nhánh agent/*)"
    model: claude/claude-opus-5-5
    # full: the owner's choice (2026-11-19); the lead hands its level down anyway.
    # Bash stays in the OS sandbox; Write/Edit do not. The merge gate still guards main.
    approval: full
    computer: off
    cwd: /Users/vyductan/Developer/g-bots/bl3q-agent
    soul: { file: souls/bl3q-fix.md }

  # The one checker of each branch (owner 22/11, after pstack: one verifier per
  # PR, and only a verdict from an agent that did not write the code counts). It
  # was two bots (bl3q-review read the code, bl3q-verify drove the game); merged
  # into one verdict file in its folder ~/.bl3q-team/review/verdicts, whose `game`
  # part (PASS / PASS+NOTES / FAIL / KHONG_KIEM) the merge gate reads: FAIL is
  # refused, an unverified branch still merges (owner's choice).
  # Opus: it alone judges edited tests, so a strong model is harder for fix's own
  # explanations to talk round. `full` (owner's choice 22/11) so its one
  # excludedCommand, tools/lai_game.sh, runs without a card; Bash stays in the
  # sandbox, which cannot write any repo or its own verdicts, and lai_game.sh runs
  # its lai.py under a second sandbox that reaches the bridge but no secrets.
  - name: bl3q-verifier
    team: bl3q
    title: "bl3q kiểm (đọc code + chạy thử game)"
    model: claude/claude-opus-5-5
    approval: full
    computer: off
    cwd: /Users/vyductan/.bl3q-team/review
    soul: { file: souls/bl3q-verifier.md }

  # Records the owner's bl3q reports as tasks in project bl3q (token label
  # `bl3q-intake`); same limits as Intake, plus it reads the game bot's logs.
  - name: bl3q-intake
    team: bl3q
    title: bl3q intake (ghi nhận báo cáo)
    model: claude/claude-opus-5-5
    approval: full
    computer: off
    cwd: /Users/vyductan/.atelier/openmausbot/workspaces/bl3q-intake
    soul: { file: souls/bl3q-intake.md }
