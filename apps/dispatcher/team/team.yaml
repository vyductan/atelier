# Atelier Dispatcher: the bot team on OpenMausBot.
# Apply:  ~/.atelier/openmausbot/bin/node_modules/.bin/openmausbot team apply team.yaml --port 28799
# Check:  ... team apply team.yaml --port 28799 --check   (exit 6 = server drifted from this file)
#
# Rules (spec "Atelier Dispatcher" on vyductan.dev tasks):
# - No bot is `full` (a Chief's level is passed down to the bots it hands work to),
#   except bl3q-lead, bl3q-fix and CoS, by the owner's explicit choice on 2026-11-19.
# - Workers sit in a team WITHOUT a Chief. OpenMausBot only auto-retries a failed run and
#   sends incident turns to a Chief when the bot has one; with no Chief, a failure becomes a
#   notification to the person instead of extra model turns (server/host/chief-notices.ts).
#   CoS can still hand work to them with coordinate_bots.
# - Hard limits live in each bot's cwd `.claude/settings.json` (deny), not in `tools`:
#   for Claude, `tools` only filters MCP tools.
# - computer: off everywhere (local needs the desktop app; headless runs fail with it).
version: 1

teams:
  - name: Office
    brief: The Chief of Staff's desk. Routes work to the Workers team; never edits code.
  - name: Workers
    brief: Bots that do the work. No Chief on purpose (no automatic retries or incident turns).
  # Spec "Nhóm bot bl3q" (vyductan-tasks, project bl3q). Lead is this team's Chief
  # by the owner's choice (2026-11-19): it hands work to fix and review with
  # coordinate_bots. Its settings deny the Chief's admin tools. It runs `full` by
  # the owner's choice, which also raises fix to full. Merging is NOT a bot: the
  # merge gate (bl3q tools/agent_merge.py) reads review's verdict files.
  - name: bl3q
    brief: Daily upkeep of the bl3q game bot. Lead triages the evening digest, fix repairs on agent/* branches in a worktree, review checks independently; a code gate merges.

bots:
  - name: MausBot
    chief: false
    approval: ask
    computer: off

  - name: CoS
    team: Office
    chief: true
    title: Chief of Staff
    # Opus + full set in the UI by the owner (folded in 2026-11-19).
    model: claude/claude-opus-5-5
    approval: full
    computer: off
    cwd: /Users/vyductan/.atelier/openmausbot/workspaces/cos
    soul: { file: souls/cos.md }

  - name: Dev
    team: Workers
    title: Dev vyductan
    model: claude/claude-sonnet-5-5
    approval: edits
    computer: off
    cwd: /Users/vyductan/Developer/vyductan-agent
    soul: { file: souls/dev.md }

  # No tools at all (cwd settings deny everything): the bridge runs the
  # read-only `ops-digest` collector each morning and hands Ops the JSON.
  - name: Ops
    team: Workers
    title: Ops (tóm tắt lỗi mỗi sáng)
    model: claude/claude-haiku-5-5
    approval: ask
    computer: off
    cwd: /Users/vyductan/.atelier/openmausbot/workspaces/ops
    soul: { file: souls/ops.md }

  # g-bots (read-only investigator) was removed 2026-11-19: bl3q has its own
  # team now. The bot is hidden in OpenMausBot, not deleted (its threads stay).

  # --- team bl3q -----------------------------------------------------------
  # cwd under ~/.bl3q-team, NOT ~/.atelier: the sandbox and Read denies block
  # ~/.atelier, and review's Bash must run from its own folder.
  - name: bl3q-lead
    team: bl3q
    chief: true
    title: bl3q lead (tổng hợp, giao việc)
    model: claude/claude-opus-5-5  # changed in the web UI 2026-11-19
    # full: the OWNER's choice (2026-11-19), made knowing that OpenMausBot raises
    # every thread this Chief hands work to up to full (delegatedApprovalMode),
    # so bl3q-fix runs full too and its Write tool is not sandboxed.
    approval: full
    computer: off
    cwd: /Users/vyductan/.bl3q-team/lead
    soul: { file: souls/bl3q-lead.md }

  # Bash auto-allowed only inside the sandbox (autoAllowBashIfSandboxed):
  # writes limited to the worktree and refs/heads/agent/*, no network.
  - name: bl3q-fix
    team: bl3q
    title: bl3q fix (sửa trên nhánh agent/*)
    model: claude/claude-sonnet-5-5
    # full: the owner's choice (2026-11-19); the lead hands its level down anyway.
    # Bash stays in the OS sandbox; Write/Edit do not. The merge gate still guards main.
    approval: full
    computer: off
    cwd: /Users/vyductan/Developer/g-bots/bl3q-agent
    soul: { file: souls/bl3q-fix.md }

  # `auto` so it can read the worktree and run tests without a card; the
  # sandbox cannot write to any repo, so its only output is a verdict file.
  - name: bl3q-review
    team: bl3q
    title: bl3q review (kiểm độc lập)
    # Opus, not fix's Sonnet: review alone judges edited tests, so a different
    # (stronger) model is harder for fix's own explanations to talk round.
    model: claude/claude-opus-5-5
    approval: auto
    computer: off
    cwd: /Users/vyductan/.bl3q-team/review
    soul: { file: souls/bl3q-review.md }
