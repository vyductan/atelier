<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#30366f"/>
      <stop offset="1" stop-color="#121530"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e6d6b8"/>
    </linearGradient>
    <linearGradient id="ledge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc062"/>
      <stop offset="1" stop-color="#f08a36"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a5a"/>
      <stop offset="0.55" stop-color="#f25f6b"/>
      <stop offset="1" stop-color="#8b4cc9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#05061a" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#05061a" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f3fa"/>
      <stop offset="1" stop-color="#c7ccdd"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e7f1"/>
      <stop offset="1" stop-color="#aeb4c8"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#3a4290" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a4290" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>
  <g filter="url(#shadow)">
    <path d="M512 250 L560 776" stroke="#3a3f7c" stroke-width="32" stroke-linecap="round"/>
    <path d="M490 222 Q512 200 534 222 L292 800 Q268 812 248 798 Z" fill="url(#leg)" stroke="url(#leg)" stroke-width="18" stroke-linejoin="round"/>
    <path d="M534 222 Q512 200 490 222 L732 800 Q756 812 776 798 Z" fill="url(#leg)" stroke="url(#leg)" stroke-width="18" stroke-linejoin="round"/>
    <rect x="322" y="572" width="380" height="74" rx="37" fill="url(#ledge)" filter="url(#soft)"/>
    <!-- laptop resting on the ledge -->
    <g filter="url(#soft)">
      <rect x="362" y="338" width="300" height="214" rx="20" fill="url(#lid)"/>
      <rect x="380" y="356" width="264" height="178" rx="10" fill="#11142c"/>
      <rect x="380" y="356" width="264" height="178" rx="10" fill="url(#screenGlow)"/>
      <path d="M420 400 L466 444 L420 488" fill="none" stroke="#ffc062" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="484" y="466" width="76" height="24" rx="12" fill="#fffaf0"/>
      <path d="M334 550 L690 550 L708 574 Q710 582 700 582 L324 582 Q314 582 316 574 Z" fill="url(#deck)"/>
      <rect x="474" y="552" width="76" height="9" rx="4.5" fill="#9aa0b8"/>
    </g>
  </g>
  <circle cx="752" cy="272" r="104" fill="url(#glow)"/>
  <circle cx="752" cy="272" r="50" fill="#34d399"/>
  <circle cx="752" cy="272" r="50" fill="none" stroke="#0f5c43" stroke-opacity="0.35" stroke-width="6"/>
  <circle cx="736" cy="256" r="15" fill="#ffffff" fill-opacity="0.6"/>
</svg>
